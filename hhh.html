<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#f7f7fb" />
<title>우리 가족 캘린더</title>
<style>
:root{--bg:#f7f8fc;--white:#fff;--ink:#20233a;--muted:#85899c;--line:#eceef5;--purple:#7565e9;--soft:#f0edff;--shadow:0 15px 45px rgba(42,39,88,.055);--radius:22px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #b7b0ff;outline-offset:2px}.app{max-width:1500px;margin:0 auto;min-height:100vh;padding:32px 34px 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:13px}.brandmark{width:47px;height:47px;border-radius:16px;background:#7565e9;display:grid;place-items:center;color:white;font-size:23px;box-shadow:0 9px 18px #7565e930}.brand h1{font-size:23px;margin:0;letter-spacing:-1.1px}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;align-items:center;gap:9px}.button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:11px 14px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,background .15s}.button:hover{transform:translateY(-1px);background:#fafaff}.primary{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 6px 16px #7565e92a}.primary:hover{background:#6655e0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 332px;gap:22px;align-items:start}.main{min-width:0}.hero{background:linear-gradient(114deg,#8174e9,#a58bea);color:#fff;border-radius:var(--radius);padding:25px 29px;margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;overflow:hidden;position:relative;min-height:145px}.hero:after{content:'✦';position:absolute;right:40px;top:-65px;font-size:230px;color:#ffffff1d;transform:rotate(-12deg);pointer-events:none}.hero .eyebrow{font-size:12px;opacity:.85;margin-bottom:9px}.hero h2{font-size:26px;letter-spacing:-1.2px;line-height:1.35;margin:0}.hero p{margin:10px 0 0;font-size:13px;opacity:.87}.heroicon{font-size:66px;position:relative;z-index:1;filter:drop-shadow(0 6px 6px #443b8020)}.panel{background:var(--white);border:1px solid #f0f0f6;box-shadow:var(--shadow);border-radius:var(--radius)}.calendar{padding:25px 24px 21px}.calhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:23px;flex-wrap:wrap}.monthnav{display:flex;align-items:center;gap:13px}.monthnav h2{font-size:23px;min-width:150px;margin:0;letter-spacing:-.8px}.iconbtn{width:34px;height:34px;border:none;background:#f6f6fc;border-radius:10px;font-size:18px;display:inline-grid;place-items:center;color:#51536a}.iconbtn:hover{background:var(--soft)}.caltools{display:flex;gap:8px;align-items:center}.mutedbutton{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:700;color:#65677d}.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays{border-bottom:1px solid var(--line)}.weekdays div{text-align:center;color:#9599aa;padding:11px 3px 15px;font-weight:700;font-size:12px}.weekdays div:first-child{color:#e48d9c}.weekdays div:last-child{color:#7c91d6}.day{min-height:113px;border-right:1px solid #f1f2f7;border-bottom:1px solid #f1f2f7;padding:9px 6px 6px;min-width:0;cursor:pointer;background:#fff;transition:background .14s;position:relative}.day:nth-child(7n){border-right:0}.day:hover{background:#faf9ff}.day.other{background:#fcfcfe}.day.other .num{color:#c7c9d5}.num{font-size:12px;width:27px;height:27px;display:grid;place-items:center;border-radius:9px;color:#4b5068;font-weight:700;margin-bottom:5px}.day.today .num{background:var(--purple);color:white}.day.selected{background:#f8f6ff;box-shadow:inset 0 0 0 2px #cbc4ff}.events{display:flex;flex-direction:column;gap:3px}.ev{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%;border:0;text-align:left;padding:4px 5px;border-radius:6px;background:var(--evbg);color:var(--evcolor);font-size:10px;font-weight:700;line-height:1.3}.ev:hover{filter:brightness(.97)}.more{font-size:10px;color:#8c8fa3;margin:3px 3px}.calfooter{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;font-size:11px;color:#a0a2b1}.legend{display:flex;gap:13px;flex-wrap:wrap}.legend span{display:inline-flex;align-items:center;gap:6px}.dot{width:8px;height:8px;display:inline-block;border-radius:50%}.side{display:flex;flex-direction:column;gap:18px}.sidepanel{padding:21px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.sectionhead h3{font-size:16px;margin:0;letter-spacing:-.6px}.sectionhead .hint{font-size:11px;color:#9a9bad}.members{display:flex;flex-direction:column;gap:10px}.member{display:flex;align-items:center;gap:11px;padding:9px 10px;border:1px solid #f0f0f6;border-radius:12px;background:#fff;cursor:pointer}.member.off{opacity:.42}.avatar{width:32px;height:32px;border-radius:11px;background:var(--csoft);color:var(--c);display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}.membername{font-size:12px;font-weight:700;flex:1}.membercount{font-size:11px;color:#a2a4b0}.check{font-size:15px;color:var(--purple)}.sectionmini{border:none;background:none;color:var(--purple);font-size:12px;font-weight:700}.selected-date{font-size:13px;color:#7f8397;margin:-5px 0 15px}.agenda{display:flex;flex-direction:column;gap:10px}.agenda-item{display:flex;gap:10px;cursor:pointer;padding:11px;border-radius:13px;background:#f9f9fd;border:1px solid transparent}.agenda-item:hover{border-color:#ddd7ff}.bar{border-radius:10px;background:var(--c);width:4px;flex-shrink:0}.agenda-info{flex:1;min-width:0}.agenda-info strong{display:block;font-size:12px;line-height:1.45;overflow-wrap:anywhere}.agenda-info p{font-size:11px;margin:5px 0 0;color:#9699aa}.pill{font-size:10px;font-weight:800;border-radius:6px;padding:3px 6px;white-space:nowrap;align-self:flex-start;background:var(--csoft);color:var(--c)}.empty{padding:22px 10px;text-align:center;color:#a1a2b1;font-size:12px;line-height:1.7}.empty .emoji{font-size:28px;display:block;margin-bottom:6px}.search{width:100%;background:#f8f8fc;border:1px solid #ededf4;padding:12px 13px;border-radius:11px;outline:none;font-size:12px}.searchresults{max-height:240px;overflow:auto;margin-top:10px}.searchresult{display:block;width:100%;border:0;border-bottom:1px solid #f1f1f7;background:transparent;text-align:left;padding:9px 2px;font-size:12px;color:#44465d}.searchresult small{display:block;color:#9a9bac;font-size:10px;margin-top:3px}.tip{background:#eeebff;border-radius:17px;padding:18px 20px;color:#6459ae;font-size:12px;line-height:1.7}.tip strong{display:block;margin-bottom:4px}.tip p{margin:0;color:#837caf}.bottom-actions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}.bottom-actions button{border:1px solid #e6e2f3;background:#fff;padding:8px 10px;border-radius:9px;color:#6f679b;font-weight:700;font-size:11px}.overlay{position:fixed;inset:0;background:#25213e80;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(3px)}.overlay.open{display:flex}.modal{background:white;border-radius:22px;padding:25px;max-width:465px;width:100%;max-height:min(90vh,800px);overflow:auto;box-shadow:0 24px 90px #1c1b3b44}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modalhead h2{font-size:21px;letter-spacing:-.6px;margin:0}.field{display:block;margin-bottom:15px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px;color:#595b72}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #e7e8f0;border-radius:10px;outline:none;background:#fff;color:#2d3049;font-size:13px}.field textarea{resize:vertical;min-height:75px}.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checkboxline{display:flex;align-items:center;gap:8px;font-size:12px;margin:0 0 15px}.checkboxline input{accent-color:var(--purple)}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:19px}.danger{margin-right:auto;color:#e36b7a;border-color:#ffe1e5}.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);background:#302c4b;color:white;border-radius:12px;padding:12px 18px;font-size:12px;box-shadow:0 12px 40px #0003;z-index:30;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.smallnote{font-size:11px;color:#9397a8;line-height:1.55;margin-top:8px}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:1100px){.layout{grid-template-columns:minmax(0,1fr) 285px;gap:14px}.app{padding:22px}.calendar{padding:20px 15px}.day{min-height:98px}.sidepanel{padding:17px}}
@media(max-width:820px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tip{grid-column:1/-1}.hero{min-height:130px}.day{min-height:104px}}
@media(max-width:560px){.app{padding:17px 10px 42px}.top{margin-bottom:17px;padding:0 4px}.brand h1{font-size:18px}.brand p{font-size:10px}.brandmark{height:40px;width:40px;border-radius:13px}.top-actions .secondary-top{display:none}.top-actions .button{padding:10px;font-size:12px}.hero{padding:21px;min-height:125px;border-radius:17px;margin-bottom:12px}.hero h2{font-size:21px}.heroicon{font-size:45px}.hero p{font-size:11px}.calendar{padding:17px 8px;border-radius:16px}.calhead{padding:0 5px}.monthnav{gap:7px}.monthnav h2{font-size:19px;min-width:126px}.caltools{gap:5px}.caltools .mutedbutton{padding:8px}.weekdays div{font-size:11px}.day{min-height:86px;padding:6px 2px}.num{width:24px;height:24px;font-size:11px;margin-bottom:3px}.ev{font-size:9px;padding:3px 2px;border-radius:4px}.more{font-size:9px}.side{display:flex}.calfooter{padding:0 6px}.legend{gap:8px}.fieldrow{grid-template-columns:1fr 1fr}.modal{padding:20px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="brandmark" aria-hidden="true">♥</div><div><h1>우리 가족 캘린더</h1><p>함께하는 하루, 소중한 우리 일정</p></div></div><div class="top-actions"><button class="button secondary-top" id="goToday">⌖ 오늘</button><button class="button primary" id="addEvent">＋ 일정 추가</button></div></header>
<div class="layout"><main class="main"><section class="hero"><div><div class="eyebrow">OUR FAMILY PLANNER ✨</div><h2>함께 만드는<br>우리 가족의 하루</h2><p id="heroMessage">서로의 일정을 한눈에 확인해요.</p></div><div class="heroicon" aria-hidden="true">🗓️</div></section><section class="panel calendar"><div class="calhead"><div class="monthnav"><button class="iconbtn" id="prevMonth" aria-label="이전 달">‹</button><h2 id="monthTitle"></h2><button class="iconbtn" id="nextMonth" aria-label="다음 달">›</button></div><div class="caltools"><button class="mutedbutton" id="todayCal">오늘</button><button class="mutedbutton" id="monthAdd">＋ 추가</button></div></div><div class="weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="days" id="calendarGrid" role="grid" aria-label="월간 달력"></div><div class="calfooter"><div class="legend" id="legend"></div><span>날짜를 눌러 일정을 확인하세요</span></div></section></main><aside class="side"><section class="panel sidepanel"><div class="sectionhead"><h3>👨‍👩‍👧‍👦 우리 가족</h3><button class="sectionmini" id="manageMembers">＋ 구성원</button></div><div class="members" id="memberList"></div><div class="smallnote">구성원을 누르면 해당 일정만 표시하거나 숨길 수 있어요.</div></section><section class="panel sidepanel"><div class="sectionhead"><h3>📌 선택한 날의 일정</h3><span class="hint" id="agendaCount"></span></div><p class="selected-date" id="selectedDateText"></p><div class="agenda" id="agenda"></div><button class="button" style="width:100%;margin-top:14px;background:#f3f0ff;color:#7162d8;border:none" id="addForDate">＋ 이 날 일정 추가</button></section><section class="panel sidepanel"><div class="sectionhead"><h3>🔎 일정 찾기</h3></div><input class="search" type="search" id="searchInput" placeholder="일정명, 메모 검색" aria-label="일정 검색" /><div class="searchresults" id="searchResults"></div></section><div class="tip"><strong>💜 우리 가족의 약속을 기록해요</strong><p>일정은 현재 브라우저에 자동 저장됩니다. 파일로 백업하거나 다른 기기로 옮길 수 있어요.</p><div class="bottom-actions"><button id="exportBtn">↓ 백업 저장</button><button id="importBtn">↑ 백업 불러오기</button><button id="icsBtn">↗ 캘린더 내보내기</button><input type="file" id="importFile" accept=".json,application/json" hidden /></div></div></aside></div></div>
<div class="overlay" id="eventOverlay" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="eventHeading"><div class="modalhead"><h2 id="eventHeading">새 일정 추가</h2><button class="iconbtn" id="closeEvent" aria-label="닫기">✕</button></div><form id="eventForm"><input type="hidden" id="eventId" /><div class="field"><label for="eventTitle">일정 이름 *</label><input id="eventTitle" maxlength="80" placeholder="예: 가족 외식, 학원, 병원 예약" required /></div><div class="fieldrow"><div class="field"><label for="eventDate">날짜 *</label><input type="date" id="eventDate" required /></div><div class="field"><label for="eventMember">담당 가족 *</label><select id="eventMember" required></select></div></div><label class="checkboxline"><input type="checkbox" id="allDay" checked /> 하루 종일</label><div class="fieldrow" id="timeFields" hidden><div class="field"><label for="startTime">시작 시간</label><input type="time" id="startTime" value="09:00" /></div><div class="field"><label for="endTime">종료 시간</label><input type="time" id="endTime" value="10:00" /></div></div><div class="field"><label for="eventMemo">메모 (선택)</label><textarea id="eventMemo" maxlength="1000" placeholder="장소, 준비물 등 기억할 내용을 남겨보세요"></textarea></div><div class="modalactions"><button type="button" class="button danger" id="deleteEvent" hidden>삭제</button><button type="button" class="button" id="cancelEvent">취소</button><button type="submit" class="button primary">저장하기</button></div></form></div></div>
<div class="overlay" id="memberOverlay" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="memberHeading"><div class="modalhead"><h2 id="memberHeading">가족 구성원 관리</h2><button class="iconbtn" id="closeMember" aria-label="닫기">✕</button></div><div id="memberManageList"></div><form id="memberForm" style="margin-top:18px"><div class="fieldrow"><div class="field"><label for="newMemberName">구성원 이름</label><input id="newMemberName" placeholder="예: 할머니" maxlength="15" required /></div><div class="field"><label for="newMemberColor">색상</label><select id="newMemberColor"><option value="#7465df">보라</option><option value="#ee8999">핑크</option><option value="#4d9fa2">민트</option><option value="#df9a44">오렌지</option><option value="#6a8ce1">파랑</option><option value="#ab77bd">라벤더</option><option value="#7aa75e">초록</option></select></div></div><div class="modalactions"><button type="submit" class="button primary">＋ 구성원 추가</button></div></form></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const STORE='our-family-calendar-v1';
const palette=['#7465df','#ee8999','#4d9fa2','#df9a44','#6a8ce1','#ab77bd','#7aa75e'];
const today=new Date(),isoLocal=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const TODAY=isoLocal(today);
const defaults=()=>({members:[{id:'m1',name:'엄마',color:'#ee8999'},{id:'m2',name:'아빠',color:'#6a8ce1'},{id:'m3',name:'아이',color:'#4d9fa2'},{id:'m4',name:'온 가족',color:'#7465df'}],events:[]});
let state;
try{const raw=JSON.parse(localStorage.getItem(STORE));state=validate(raw)?raw:defaults()}catch(e){state=defaults()}
const hidden=new Set(),view=new Date(today.getFullYear(),today.getMonth(),1);let selected=TODAY,toastTimer;
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function validate(s){return s&&Array.isArray(s.members)&&s.members.length>0&&s.members.length<51&&s.members.every(m=>typeof m.id==='string'&&typeof m.name==='string'&&/^#[0-9a-fA-F]{6}$/.test(m.color))&&Array.isArray(s.events)&&s.events.length<10000&&s.events.every(e=>typeof e.id==='string'&&typeof e.title==='string'&&typeof e.date==='string'&&/^\d{4}-\d\d-\d\d$/.test(e.date)&&typeof e.memberId==='string')}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){toast('저장 공간이 부족합니다. 백업 파일을 저장해 주세요.')}}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2400)}
const member=id=>state.members.find(m=>m.id===id)||{name:'미지정',color:'#999999'};
function tint(hex){return hex+'1c'}
function visibleEvents(date){return state.events.filter(e=>e.date===date&&!hidden.has(e.memberId)).sort((a,b)=>(a.allDay===false?1:0)-(b.allDay===false?1:0)||String(a.startTime||'').localeCompare(String(b.startTime||''))||a.title.localeCompare(b.title,'ko'))}
function dateLabel(s){const [y,m,d]=s.split('-').map(Number);return `${y}년 ${m}월 ${d}일 (${['일','월','화','수','목','금','토'][new Date(y,m-1,d).getDay()]})`}
function render(){renderCalendar();renderMembers();renderAgenda();renderSearch();}
function renderCalendar(){const y=view.getFullYear(),m=view.getMonth();$('monthTitle').textContent=`${y}년 ${String(m+1).padStart(2,'0')}월`;const first=new Date(y,m,1).getDay(),end=new Date(y,m+1,0).getDate(),rows=Math.ceil((first+end)/7),html=[];for(let i=0;i<rows*7;i++){const d=new Date(y,m,1-first+i),key=isoLocal(d),inside=d.getMonth()===m,evs=visibleEvents(key);html.push(`<div class="day${inside?'':' other'}${key===TODAY?' today':''}${key===selected?' selected':''}" role="gridcell" tabindex="0" data-date="${key}" aria-label="${dateLabel(key)}, 일정 ${evs.length}개"><span class="num">${d.getDate()}</span><div class="events">${evs.slice(0,3).map(e=>{const mm=member(e.memberId);return `<button class="ev" style="--evbg:${tint(mm.color)};--evcolor:${mm.color}" data-event="${esc(e.id)}" title="${esc(e.title)}">${esc(e.title)}</button>`}).join('')}${evs.length>3?`<span class="more">+${evs.length-3}개 더보기</span>`:''}</div></div>`)}$('calendarGrid').innerHTML=html.join('');$('legend').innerHTML=state.members.filter(m=>!hidden.has(m.id)).map(m=>`<span><i class="dot" style="background:${m.color}"></i>${esc(m.name)}</span>`).join('');const monthCount=state.events.filter(e=>e.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}-`)).length;$('heroMessage').textContent=monthCount?`이번 달 가족 일정 ${monthCount}개가 기다리고 있어요.`:'이번 달 첫 가족 일정을 등록해 보세요.'}
function renderMembers(){$('memberList').innerHTML=state.members.map(m=>{const count=state.events.filter(e=>e.memberId===m.id&&e.date.slice(0,7)===isoLocal(view).slice(0,7)).length;return `<button class="member${hidden.has(m.id)?' off':''}" data-member="${esc(m.id)}" aria-pressed="${!hidden.has(m.id)}"><span class="avatar" style="--c:${m.color};--csoft:${tint(m.color)}">${esc(m.name.slice(0,1))}</span><span class="membername">${esc(m.name)}</span><span class="membercount">${count}개</span><span class="check">${hidden.has(m.id)?'○':'✓'}</span></button>`}).join('')}
function renderAgenda(){const evs=visibleEvents(selected);$('selectedDateText').textContent=dateLabel(selected);$('agendaCount').textContent=`${evs.length}개 일정`;$('agenda').innerHTML=evs.length?evs.map(e=>{const m=member(e.memberId),time=e.allDay===false?`${esc(e.startTime||'')} ~ ${esc(e.endTime||'')}`:'하루 종일';return `<article class="agenda-item" data-event="${esc(e.id)}" tabindex="0" role="button" aria-label="${esc(e.title)} 수정"><div class="bar" style="--c:${m.color}"></div><div class="agenda-info"><strong>${esc(e.title)}</strong><p>${time}${e.memo?' · '+esc(e.memo.slice(0,32)):''}</p></div><span class="pill" style="--c:${m.color};--csoft:${tint(m.color)}">${esc(m.name)}</span></article>`}).join(''):'<div class="empty"><span class="emoji">🌿</span>아직 일정이 없어요.<br>가족과의 약속을 추가해 보세요!</div>'}
function renderSearch(){const q=$('searchInput').value.trim().toLocaleLowerCase();if(!q){$('searchResults').innerHTML='<div class="smallnote">찾고 싶은 일정 이름을 입력해 주세요.</div>';return}const evs=state.events.filter(e=>!hidden.has(e.memberId)&&`${e.title} ${e.memo||''} ${member(e.memberId).name}`.toLocaleLowerCase().includes(q)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,30);$('searchResults').innerHTML=evs.length?evs.map(e=>`<button class="searchresult" data-goto="${esc(e.id)}">${esc(e.title)}<small>${esc(e.date)} · ${esc(member(e.memberId).name)}</small></button>`).join(''):'<div class="empty">검색 결과가 없어요.</div>'}
function goDate(key){selected=key;const [y,m]=key.split('-').map(Number);view.setFullYear(y,m-1,1);render()}
function changeMonth(n){view.setMonth(view.getMonth()+n,1);selected=isoLocal(new Date(view.getFullYear(),view.getMonth(),Math.min(today.getDate(),new Date(view.getFullYear(),view.getMonth()+1,0).getDate())));render()}
function openModal(id=null,date=selected){const e=id?state.events.find(x=>x.id===id):null;$('eventHeading').textContent=e?'일정 수정':'새 일정 추가';$('eventId').value=e?.id||'';$('eventTitle').value=e?.title||'';$('eventDate').value=e?.date||date;$('eventMember').innerHTML=state.members.map(m=>`<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('');$('eventMember').value=e?.memberId||state.members[0].id;$('allDay').checked=e?.allDay!==false;$('startTime').value=e?.startTime||'09:00';$('endTime').value=e?.endTime||'10:00';$('eventMemo').value=e?.memo||'';$('deleteEvent').hidden=!e;updateTime();$('eventOverlay').classList.add('open');setTimeout(()=>$('eventTitle').focus(),30)}
function updateTime(){$('timeFields').hidden=$('allDay').checked}
function closeModal(){$('eventOverlay').classList.remove('open')}
function openMembers(){renderMemberManager();$('memberOverlay').classList.add('open')}
function renderMemberManager(){$('memberManageList').innerHTML=state.members.map(m=>`<div class="member" style="margin-bottom:8px"><span class="avatar" style="--c:${m.color};--csoft:${tint(m.color)}">${esc(m.name[0])}</span><span class="membername">${esc(m.name)}</span><button class="sectionmini" data-rename="${esc(m.id)}" type="button">이름 변경</button><button class="sectionmini" style="color:#df7783" data-remove="${esc(m.id)}" type="button">삭제</button></div>`).join('')}
$('eventForm').addEventListener('submit',e=>{e.preventDefault();const id=$('eventId').value,title=$('eventTitle').value.trim(),date=$('eventDate').value,memberId=$('eventMember').value,allDay=$('allDay').checked,startTime=$('startTime').value,endTime=$('endTime').value,memo=$('eventMemo').value.trim();if(!title||!date||!state.members.some(m=>m.id===memberId))return toast('필수 내용을 입력해 주세요.');if(!allDay&&(!startTime||!endTime||startTime>=endTime))return toast('종료 시간을 시작 시간보다 늦게 설정해 주세요.');const obj={id:id||('e'+Date.now()+'-'+Math.random().toString(36).slice(2,8)),title,date,memberId,allDay,startTime:allDay?'':startTime,endTime:allDay?'':endTime,memo};if(id){const idx=state.events.findIndex(e=>e.id===id);if(idx<0)return;state.events[idx]=obj}else state.events.push(obj);save();closeModal();goDate(date);toast(id?'일정을 수정했어요.':'새 일정을 추가했어요.')});
$('deleteEvent').addEventListener('click',()=>{const id=$('eventId').value;if(!confirm('이 일정을 삭제할까요?'))return;state.events=state.events.filter(e=>e.id!==id);save();closeModal();render();toast('일정을 삭제했어요.')});
$('calendarGrid').addEventListener('click',e=>{const ev=e.target.closest('[data-event]');if(ev){e.stopPropagation();openModal(ev.dataset.event);return}const d=e.target.closest('[data-date]');if(d)goDate(d.dataset.date)});
$('calendarGrid').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-date]')){e.preventDefault();goDate(e.target.dataset.date)}});
$('agenda').addEventListener('click',e=>{const item=e.target.closest('[data-event]');if(item)openModal(item.dataset.event)});
$('agenda').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('[data-event]')){e.preventDefault();openModal(e.target.closest('[data-event]').dataset.event)}});
$('memberList').addEventListener('click',e=>{const item=e.target.closest('[data-member]');if(!item)return;hidden.has(item.dataset.member)?hidden.delete(item.dataset.member):hidden.add(item.dataset.member);render()});
$('searchResults').addEventListener('click',e=>{const r=e.target.closest('[data-goto]');if(!r)return;const ev=state.events.find(x=>x.id===r.dataset.goto);if(ev){goDate(ev.date);openModal(ev.id)}});
$('searchInput').addEventListener('input',renderSearch);
$('prevMonth').onclick=()=>changeMonth(-1);$('nextMonth').onclick=()=>changeMonth(1);$('todayCal').onclick=$('goToday').onclick=()=>goDate(TODAY);
$('addEvent').onclick=$('monthAdd').onclick=$('addForDate').onclick=()=>openModal();$('closeEvent').onclick=$('cancelEvent').onclick=closeModal;$('allDay').onchange=updateTime;$('manageMembers').onclick=openMembers;$('closeMember').onclick=()=>$('memberOverlay').classList.remove('open');
$('memberForm').addEventListener('submit',e=>{e.preventDefault();const name=$('newMemberName').value.trim(),color=$('newMemberColor').value;if(!name)return;if(state.members.length>=20)return toast('가족 구성원은 20명까지 추가할 수 있어요.');state.members.push({id:'m'+Date.now()+Math.random().toString(36).slice(2,5),name,color});$('newMemberName').value='';save();render();renderMemberManager();toast('가족 구성원을 추가했어요.')});
$('memberManageList').addEventListener('click',e=>{const ren=e.target.closest('[data-rename]'),rem=e.target.closest('[data-remove]');if(ren){const m=state.members.find(x=>x.id===ren.dataset.rename);if(!m)return;const name=prompt('변경할 이름을 입력하세요.',m.name);if(name===null)return;if(!name.trim())return toast('이름을 입력해 주세요.');m.name=name.trim().slice(0,15)}else if(rem){const m=state.members.find(x=>x.id===rem.dataset.remove);if(!m)return;if(state.members.length===1)return toast('가족 구성원은 최소 1명이 필요해요.');const num=state.events.filter(x=>x.memberId===m.id).length;if(!confirm(`${m.name} 구성원을 삭제할까요? 연결된 일정 ${num}개도 삭제됩니다.`))return;state.members=state.members.filter(x=>x.id!==m.id);state.events=state.events.filter(x=>x.memberId!==m.id);hidden.delete(m.id)}else return;save();render();renderMemberManager()});
for(const id of ['eventOverlay','memberOverlay'])$(id).addEventListener('mousedown',e=>{if(e.target===$(id))$(id).classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('memberOverlay').classList.remove('open')}});
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('exportBtn').onclick=()=>{download(`우리집-캘린더-백업-${TODAY}.json`,JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'application/json');toast('백업 파일을 저장했어요.')};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>4000000)throw new Error('파일이 너무 큽니다.');const obj=JSON.parse(await file.text());if(!validate(obj))throw new Error('유효한 가족 달력 백업 파일이 아닙니다.');if(!confirm('기존 가족 구성원과 일정을 백업 파일 내용으로 바꿀까요?'))return;state={members:obj.members,events:obj.events};hidden.clear();save();render();toast('백업 데이터를 불러왔어요.')}catch(err){toast(err.message||'백업 파일을 읽지 못했어요.')}finally{e.target.value=''}});
function icsEscape(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function icsDate(d){return d.replace(/-/g,'')}
$('icsBtn').onclick=()=>{const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Our Family Calendar//KO','CALSCALE:GREGORIAN','X-WR-CALNAME:우리 가족 캘린더'];state.events.forEach(e=>{const date=e.date.replace(/-/g,''),mm=member(e.memberId);lines.push('BEGIN:VEVENT','UID:'+e.id.replace(/[^a-zA-Z0-9_-]/g,'')+'@our-family.local','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'').replace(/Z$/,'Z'),'SUMMARY:'+icsEscape('['+mm.name+'] '+e.title),'DESCRIPTION:'+icsEscape(e.memo||''));if(e.allDay!==false){const next=new Date(e.date+'T12:00:00');next.setDate(next.getDate()+1);lines.push('DTSTART;VALUE=DATE:'+date,'DTEND;VALUE=DATE:'+icsDate(isoLocal(next)))}else{lines.push('DTSTART;TZID=Asia/Seoul:'+date+'T'+(e.startTime||'09:00').replace(':','')+'00','DTEND;TZID=Asia/Seoul:'+date+'T'+(e.endTime||'10:00').replace(':','')+'00')}lines.push('END:VEVENT')});lines.push('END:VCALENDAR');download(`우리집-캘린더-${TODAY}.ics`,lines.join('\r\n'),'text/calendar;charset=utf-8');toast('캘린더 파일을 저장했어요.')};
render();
})();
</script>
</body>
</html>
